<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Mock Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f3f6;color:#222;line-height:1.6}
header{background:#1f2a44;color:#fff;padding:10px 24px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:17px}#tm{background:#c62828;font-size:22px;font-weight:700;padding:4px 18px;border-radius:6px;min-width:110px;text-align:center}#tm.low{animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
button{cursor:pointer;border:0;border-radius:6px;padding:9px 18px;font-size:15px;font-weight:700;background:#2563eb;color:#fff}button.g{background:#16a34a}button.o{background:#f59e0b;color:#222}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
.p{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 5px #0002}.sc{height:calc(100vh - 100px);overflow-y:auto;position:sticky;top:70px}
.one{max-width:900px;margin:16px auto;padding:0 16px}
h2,h3{color:#1f2a44;margin:.3em 0}.ins{background:#eef2ff;border-left:4px solid #2563eb;padding:10px 14px;margin:10px 0;font-size:14px}
.q{margin:8px 0}.q label{display:block;padding:3px 8px;border-radius:4px;cursor:pointer}.q label:hover{background:#eef2ff}
.n{display:inline-block;background:#1f2a44;color:#fff;border-radius:4px;padding:0 7px;font-weight:700;font-size:13px;margin-right:4px}
input[type=text],select{border:1.5px solid #94a3b8;border-radius:4px;padding:4px 8px;font-size:15px;width:150px}
.start{max-width:640px;margin:60px auto;text-align:center}.start li{text-align:left;margin:6px 0}
audio{display:none}.aud{background:#eef2ff;padding:8px 12px;border-radius:6px;font-size:14px;margin:8px 0}
img{max-width:100%}#hb{position:absolute;display:none;background:#222;padding:5px 7px;border-radius:6px;z-index:99;gap:5px}#hb span{width:22px;height:22px;border-radius:50%;cursor:pointer;display:inline-block;border:2px solid #fff;margin:0 2px}
mark{padding:0;border-radius:2px}
textarea{width:100%;height:calc(100vh - 230px);border:1.5px solid #94a3b8;border-radius:6px;padding:12px;font-size:16px;font-family:inherit;resize:none}
#wc{font-weight:700;margin-top:6px}.r{padding:6px 10px;margin:4px 0;border-radius:5px;font-size:14px}.ok{background:#dcfce7}.no{background:#fee2e2}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.sc{height:auto;position:static}}
</style></head><body>

const PASS=[['','Floods can occur in rivers when the flow rate exceeds the capacity of the river channel, particularly at bends or meanders in the waterway. Floods often cause damage to homes and businesses if they are in the natural flood plains of rivers. While riverine flood damage can be eliminated by moving away from rivers and other bodies of water, people have traditionally lived and worked by rivers because the land is usually flat and fertile and because rivers provide easy travel and access to commerce and industry.'],
['A','FIRE and flood are two of humanity’s worst nightmares. People have, therefore, always sought to control them. Forest fires are snuffed out quickly. The flow of rivers is regulated by weirs and dams. At least, that is how it used to be. But foresters have learned that forests need fires to clear out the brush and even to get seeds to germinate. And a similar revelation is now dawning on hydrologists. Rivers — and the ecosystems they support — need floods. That is why a man-made torrent has been surging down the Grand Canyon. By Thursday March 6th it was running at full throttle, which was expected to be sustained for 60 hours.'],
['B','Floods once raged through the canyon every year. Spring snow from as far away as Wyoming would melt and swell the Colorado river to a flow that averaged around 1,500 cubic metres (50,000 cubic feet) a second. Every eight years or so, that figure rose to almost 3,000 cubic metres. These floods infused the river with sediment, carved its beaches and built its sandbars.'],
['C','However, in the four decades since the building of the Glen Canyon dam, just upstream of the Grand Canyon, the only sediment that it has collected has come from tiny, undammed tributaries. Even that has not been much use as those tributaries are not powerful enough to distribute the sediment in an ecologically valuable way.'],
['D','This lack of flooding has harmed local wildlife. The humpback chub, for example, thrived in the rust-red waters of the Colorado. Recently, though, its population has crashed. At first sight, it looked as if the reason was that the chub were being eaten by trout introduced for sport fishing in the mid-20th century. But trout and chub co-existed until the Glen Canyon dam was built, so something else is going on. Steve Gloss, of the United States’ Geological Survey (USGS), reckons that the chub’s decline is the result of their losing their most valuable natural defense, the Colorado’s rusty sediment. The chub were well adapted to the poor visibility created by the thick, red water which gave the river its name, and depended on it to hide from predators. Without the cloudy water the chub became vulnerable.'],
['E','And the chub are not alone. In the years since the Glen Canyon dam was built, several species have vanished altogether. These include the Colorado pike-minnow, the razorback sucker and the roundtail chub. Meanwhile, aliens including fathead minnows, channel catfish and common carp, which would have been hard put to survive in the savage waters of the undammed canyon, have moved in.'],
['F','So flooding is the obvious answer. Unfortunately, it is easier said than done. Floods were sent down the Grand Canyon in 1996 and 2004 and the results were mixed. In 1996 the flood was allowed to go on too long. To start with, all seemed well. The floodwaters built up sandbanks and infused the river with sediment. Eventually, however, the continued flow washed most of the sediment out of the canyon. This problem was avoided in 2004, but unfortunately, on that occasion, the volume of sand available behind the dam was too low to rebuild the sandbanks. This time, the USGS is convinced that things will be better. The amount of sediment available is three times greater than it was in 2004. So if a flood is going to do some good, this is the time to unleash one.'],
['G','Even so, it may turn out to be an empty gesture. At less than 1,200 cubic metres a second, this flood is smaller than even an average spring flood, let alone one of the mightier deluges of the past. Those glorious inundations moved massive quantities of sediment through the Grand Canyon, wiping the slate dirty, and making a muddy mess of silt and muck that would make modern river rafters cringe.']];

const TASK='The pie charts show the average percentages of sodium, saturated fat and added sugars in typical meals consumed in the USA.';
let R={L:{},R:{},W:''},stage=0,left=0,iv=null,wm=null;
const MODS=['Listening','Reading','Writing'];
function collect(o){document.querySelectorAll('[data-q]').forEach(e=>o[e.dataset.q]=e.value||'')}
function radios(n){return['TRUE','FALSE','NOT GIVEN'].map(v=>`<label><input type="radio" name="r${n}" data-q="${n}" value="${v}">${v}</label>`).join('')}
function home(){ttl.textContent='IELTS Mock Test';app.innerHTML=`<div class="start p"><h2>IELTS Academic Mock Test</h2><ol><li><b>Listening</b> – Parts 1 &amp; 2 audio + 1 minute to check answers (audio plays once, automatically)</li><li><b>Reading</b> – 30 minutes</li><li><b>Writing</b> – 60 minutes (Task 1, max 500 words)</li></ol><ul><li>Modules go in order. When time ends, the next one starts automatically.</li><li>If you move on early, the remaining time is lost and you can’t go back.</li><li>Select any text to highlight it in different colours.</li><li>Use headphones and check your sound before starting.</li></ul><button onclick="go(0)">Start Test</button></div>`}
window.ttl=$('#ttl');
function go(s){stage=s;clearInterval(iv);R.cur=s;ttl.textContent='IELTS '+MODS[s]+' Test';tm.style.display='block';tm.classList.remove('low');
 if(s==0)listen();else if(s==1)reading();else writing();
 act.innerHTML=s<2?`<button class="o" onclick="skip()">Next Module ›</button>`:`<button class="g" onclick="submitAll()">Submit Test</button>`}
function skip(){if(confirm('Move to the next module? Remaining time will be lost and you cannot come back.'))next()}
function next(){collect(stage==0?R.L:R.R);if(stage==2)return submitAll(true);if(stage==0){aud.forEach(a=>a.pause())}go(stage+1)}
function clock(sec,onEnd,tick){left=sec;draw();iv=setInterval(()=>{left--;tick&&tick();draw();if(left<=0){clearInterval(iv);onEnd()}},1000)}
function draw(){const m=Math.max(0,left);tm.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');tm.classList.toggle('low',m<=300&&stage>0||m<=30&&stage==0)}
let aud=[];
function listen(){
 app.innerHTML=`<div class="one"><div class="aud" id="as">🔊 Loading audio…</div><div class="p hl"><h2>Part 1 · Questions 1–10</h2><div class="ins">Complete the notes below. Write <b>ONE WORD AND/OR A NUMBER</b> for each answer.</div><h3>HIRING A PUBLIC ROOM</h3><div class="q">Example: the Main Hall – seats <u>200</u></div>${L1.map(l=>`<div class="q">${l.startsWith('<b>')?l:fill(l)}</div>`).join('')}</div>
 <div class="p hl" style="margin-top:16px"><h2>Part 2 · Questions 11–20</h2><h3>Fiddy Working Heritage Farm</h3><div class="ins">Questions 11–14: Complete the notes. Write <b>ONE WORD</b> for each answer.</div>${L2.map(l=>`<div class="q">${fill(l)}</div>`).join('')}<div class="ins">Questions 15–20: Label the map. Write the correct letter, <b>A–I</b>.</div><img src="${MAP}" alt="map" style="max-width:520px">${MQ.map((q,i)=>`<div class="q">${sel(15+i)} <span class="n">${15+i}</span> ${q}</div>`).join('')}</div></div>`;
 aud=[new Audio(A1),new Audio(A2)];let started=false,d=[0,0],phase=0;
 const st=$('#as'),fin=()=>{phase=2;if(left>60){left=60;draw()}st.innerHTML='⏱ Audio finished — you have 1 minute to check your answers.'};
 aud[0].onended=()=>{phase=1;st.textContent='🔊 Part 2 playing…';aud[1].play().catch(()=>{})};aud[1].onended=fin;
 aud[0].onerror=aud[1].onerror=()=>{st.innerHTML='⚠️ Audio could not load (check internet). Timer is running anyway.'};
 const begin=()=>{if(started)return;started=true;st.textContent='🔊 Part 1 playing…';aud[0].play().catch(()=>st.innerHTML='⚠️ Audio blocked/not loaded. <button onclick="aud[phase0()].play()">▶ Play</button>');
  clock(Math.round((d[0]||480)+(d[1]||480))+60+15,()=>next(),()=>{if(phase==2&&left>60){left=60}})};
 let c=0;aud.forEach((a,i)=>{a.preload='metadata';a.onloadedmetadata=()=>{d[i]=a.duration;if(++c==2&&!started)begin()}});setTimeout(begin,3000);
 window.phase0=()=>phase}
function reading(){
 const ps=PASS.map(([l,t])=>`<p>${l?`<b style="color:#1f2a44">${l}</b> `:''}${t}</p>`).join('');
 app.innerHTML=`<div class="wrap"><div class="p sc hl"><h2 style="text-align:center">Dirty River but Clean Water</h2><div class="ins"><b>Reading Passage 1</b></div>${ps}</div><div class="p sc"><h2>Questions 1–7</h2><div class="ins">Do the following statements agree with the information given in the Reading Passage?<br><b>TRUE</b> – agrees · <b>FALSE</b> – contradicts · <b>NOT GIVEN</b> – no information</div>${TF.map((t,i)=>`<div class="q"><span class="n">${i+1}</span> ${t}${radios(i+1)}</div>`).join('')}<h2>Questions 8–13</h2><div class="ins">Complete the summary. Choose <b>NO MORE THAN TWO WORDS</b> from the passage.</div><h3>The Eco-Impact of the Canyon Dam</h3>${SUM.map(s=>`<p>${fill(s)}</p>`).join('')}</div></div>`;
 clock(1800,next)}
function writing(){
 app.innerHTML=`<div class="wrap"><div class="p sc hl"><h2>Writing Task 1</h2><div class="ins">You should spend about <b>60 minutes</b> on this task.</div><p>${TASK}</p><p><b>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</b></p><p>Write at least 150 words (maximum 500 words).</p><img src="${PIE}" alt="pie charts"></div><div class="p"><textarea id="wt" placeholder="Start typing here....."></textarea><div id="wc">Words: 0 / 500</div></div></div>`;
 const t=$('#wt');t.oninput=()=>{let w=t.value.match(/\S+/g)||[];if(w.length>500){let n=0;t.value=t.value.replace(/\S+/g,m=>++n<=500?m:'').trimEnd();w=t.value.match(/\S+/g)}$('#wc').textContent='Words: '+w.length+' / 500';wm=w.length};
 clock(3600,()=>submitAll(true))}
const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function grade(K,o){let sc=0,rows=[];for(const n in K){const u=o[n]||'',ok=K[n].includes(norm(u));if(ok)sc++;rows.push([n,u||'(blank)',K[n].join(' / ').toUpperCase(),ok])}return[sc,rows]}
function submitAll(auto){if(!auto&&!confirm('Submit your test now?'))return;clearInterval(iv);R.W=($('#wt')||{}).value||R.W;
 const [ls,lr]=grade(LK,R.L),[rs,rr]=grade(RK,R.R),wc=(R.W.match(/\S+/g)||[]).length;
 act.innerHTML='';tm.style.display='none';ttl.textContent='Test Result';
 const rows=r=>r.map(x=>`<div class="r ${x[3]?'ok':'no'}"><b>Q${x[0]}</b> · Your answer: ${x[1].replace(/</g,'&lt;')} · Correct: ${x[2]} ${x[3]?'✔':'✘'}</div>`).join('');
 app.innerHTML=`<div class="one"><div class="p"><h2>Your Results</h2><p style="font-size:18px">Listening: <b>${ls}/20</b> · Reading: <b>${rs}/13</b> · Writing: <b>${wc} words</b> (needs manual marking)</p><button class="g" onclick="pdf()">⬇ Download PDF</button><h3>Listening</h3>${rows(lr)}<h3>Reading</h3>${rows(rr)}<h3>Writing</h3><p style="white-space:pre-wrap">${(R.W||'(no answer)').replace(/</g,'&lt;')}</p></div></div>`;
 R.res={ls,rs,wc,lr,rr}}
function pdf(){if(!window.jspdf){alert('PDF library could not load. Connect to the internet and try again.');return}
 const d=new jspdf.jsPDF(),{ls,rs,wc,lr,rr}=R.res;let y=15;const L=(t,b,sz)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz||10);d.splitTextToSize(String(t),180).forEach(x=>{if(y>280){d.addPage();y=15}d.text(x,15,y);y+=sz?sz*.5+2:5.5})};
 L('IELTS Mock Test – Result Report',1,16);L(new Date().toLocaleString());y+=3;L(`Listening: ${ls}/20    Reading: ${rs}/13    Writing: ${wc} words`,1,12);y+=3;
 L('LISTENING',1,13);lr.forEach(x=>L(`Q${x[0]}  Your answer: ${x[1]}  |  Correct: ${x[2]}  |  ${x[3]?'Correct':'Wrong'}`));y+=3;
 L('READING',1,13);rr.forEach(x=>L(`Q${x[0]}  Your answer: ${x[1]}  |  Correct: ${x[2]}  |  ${x[3]?'Correct':'Wrong'}`));y+=3;
 L('WRITING (Task 1) – '+wc+' words',1,13);L(TASK);y+=2;L(R.W||'(no answer)');d.save('IELTS_Mock_Result.pdf')}

const hb=$('#hb');
document.addEventListener('mouseup',e=>{if(e.target.closest('#hb'))return;setTimeout(()=>{const s=getSelection();if(s.isCollapsed||!s.anchorNode)return hb.style.display='none';const el=s.anchorNode.parentElement;if(!el||!el.closest('.hl')||el.closest('input,textarea'))return hb.style.display='none';const r=s.getRangeAt(0).getBoundingClientRect();hb.style.display='flex';hb.style.left=(r.left+scrollX)+'px';hb.style.top=(r.top+scrollY-38)+'px'},10)});
hb.onmousedown=e=>e.preventDefault();
hb.onclick=e=>{const c=e.target.dataset.c;if(!c)return;const s=getSelection();if(s.isCollapsed)return;const r=s.getRangeAt(0);
 if(c=='x'){let n=r.commonAncestorContainer;n=n.nodeType==1?n:n.parentNode;const m=n.closest('mark');if(m)m.replaceWith(...m.childNodes);n.querySelectorAll&&n.querySelectorAll('mark').forEach(m=>{if(s.containsNode(m,true))m.replaceWith(...m.childNodes)})}
 else{try{const m=document.createElement('mark');m.style.background=c;r.surroundContents(m)}catch(_){const m=document.createElement('mark');m.style.background=c;m.appendChild(r.extractContents());r.insertNode(m)}}
 s.removeAllRanges();hb.style.display='none'};
home();
